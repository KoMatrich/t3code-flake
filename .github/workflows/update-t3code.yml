name: Update T3 Code

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: update-t3code
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      old: ${{ steps.update.outputs.old }}
      new: ${{ steps.update.outputs.new }}
      base_sha: ${{ steps.update.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Update release metadata
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old="$(jq -r .version sources.json)"
          nix develop --command ./scripts/update-t3code
          new="$(jq -r .version sources.json)"
          changed_files="$(git diff --name-only)"
          if [[ -n "$changed_files" && "$changed_files" != sources.json ]]; then
            printf 'updater changed unexpected files: %s\n' "$changed_files" >&2
            exit 1
          fi
          if [[ -z "$changed_files" ]]; then
            changed=false
          else
            changed=true
          fi
          git diff --exit-code -- flake.lock
          printf 'changed=%s\nold=%s\nnew=%s\nbase_sha=%s\n' "$changed" "$old" "$new" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.update.outputs.changed == 'true'
        with:
          name: t3code-sources
          path: sources.json
          retention-days: 1

  validate:
    needs: update
    if: needs.update.outputs.changed == 'true'
    name: Validate update (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t3code-sources
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Check and build release
        run: |
          git diff --exit-code -- flake.lock
          nix flake check --system "${{ matrix.system }}"
          nix build .#t3code
          HOME="$(mktemp -d)"
          export HOME
          test "$(./result/bin/t3 --version)" = "t3 v$(jq -r .version sources.json)"
          ./result/bin/t3 --help > /dev/null
          nix build .#t3code-desktop --no-link

  # Fork deviation: push the validated bump straight to main instead of opening
  # a PR, so a new T3 Code release lands with no manual step.
  publish:
    needs: [update, validate]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Confirm validated base
        run: test "$(git rev-parse HEAD)" = "${{ needs.update.outputs.base_sha }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: t3code-sources
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git commit -m "chore: update t3code to v${{ needs.update.outputs.new }}"
          git push origin HEAD:main
